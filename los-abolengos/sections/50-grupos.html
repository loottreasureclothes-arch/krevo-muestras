  <div class="ab-seam" style="background:linear-gradient(180deg, var(--deep), var(--deep-2))" aria-hidden="true"><span class="ab-rombo"></span><span class="ab-rombo"></span><span class="ab-rombo"></span></div>
  <section class="s-grupos" id="grupos" data-dark data-hide-wa aria-labelledby="gr-t">
    <div class="k-wrap">
      <p class="ab-eyebrow">Desayunos de grupo</p>
      <h2 id="gr-t" class="gr-t ab-d" data-drop>Mesa larga, mantel negro.<br><b>Menú cerrado desde hoy.</b></h2>
      <ul class="gr-facts">
        <li><span class="ab-rombo"></span>Salón privado con mesa redonda.</li>
        <li><span class="ab-rombo"></span>Terraza con sombrillas.</li>
        <li><span class="ab-rombo"></span>Valet parking.</li>
      </ul>

      <div class="gr-media">
        <figure class="gr-media-big"><img src="img/f/12-crop-1600.webp" width="1600" height="730" loading="lazy" decoding="async" alt="Mesa de evento montada con mantel negro y copas, Los Abolengos"></figure>
        <figure class="gr-media-sm ab-frame"><img src="img/f/10-1600.webp" width="1600" height="1200" loading="lazy" decoding="async" alt="Terraza con sombrillas de Los Abolengos"></figure>
      </div>

      <form class="gr-form" id="gr-form">
        <p class="gr-form-h">Pide tu cotización</p>
        <div class="gr-row">
          <div class="ab-field">
            <span>Personas</span>
            <div class="ab-stepper">
              <button type="button" data-step="-1" aria-label="Menos personas">&minus;</button>
              <input type="text" id="gr-people" value="10" inputmode="numeric" aria-label="Número de personas" readonly>
              <button type="button" data-step="1" aria-label="Más personas">+</button>
            </div>
          </div>
          <div class="ab-field">
            <span>Hora</span>
            <select id="gr-hour">
              <option value="8:00">8:00</option>
              <option value="9:00" selected>9:00</option>
              <option value="10:00">10:00</option>
              <option value="11:00">11:00</option>
              <option value="12:00">12:00</option>
              <option value="1:00">1:00</option>
            </select>
          </div>
        </div>
        <div class="ab-field">
          <span>Fecha</span>
          <input type="date" id="gr-date" class="gr-input gr-input--date">
        </div>
        <div class="ab-field">
          <span>Espacio</span>
          <div class="gr-radios" role="radiogroup" aria-label="Salón o terraza">
            <label><input type="radio" name="gr-espacio" value="Salón privado" checked><span>Salón</span></label>
            <label><input type="radio" name="gr-espacio" value="Terraza"><span>Terraza</span></label>
          </div>
        </div>
        <div class="ab-field">
          <span>Platillos de la carta (opcional)</span>
          <input type="text" id="gr-platillos" class="gr-input" placeholder="Ej. Enfrijoladas Allende, chilaquiles, café de olla">
        </div>
        <button type="button" class="ab-btn ab-btn--brand gr-send" id="gr-send">Pedir cotización de grupo</button>
        <p class="ab-sheet-fine gr-fine">Te confirmamos capacidad y anticipo por WhatsApp.</p>
      </form>
    </div>
  </section>
