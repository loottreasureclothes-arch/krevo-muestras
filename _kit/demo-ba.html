<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo antes y después</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="antesdespues.css">
<style>
  :root{--brand:#111;--ink:#111;--paper:#fff;--mute:#6b6b6b;--line:#e8e6e1;--radius:18px}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(40px,9vw,88px);line-height:.95;letter-spacing:-.02em;margin:0}
  .top{padding:64px 0 28px}
  .top p{color:var(--mute);margin:14px 0 0;font-size:17px}
  .grid{display:grid;gap:28px;padding-bottom:120vh}
  .spacer{height:70vh;display:flex;align-items:flex-end;color:var(--mute);font-size:14px;padding-bottom:20px}
  @media (min-width:768px){.wrap{padding:0 40px}.grid{grid-template-columns:1.3fr 1fr;align-items:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Tu cocina,<br>otra.</h1>
    <p>Arrastra la manija.</p>
  </div>
  <div class="grid">
    <div class="k-ba" id="ba1">
      <img class="k-ba-before" src="../closetdoor/img/cocina_antes.webp" alt="Antes" width="1168" height="880">
      <img class="k-ba-after" src="../closetdoor/img/cocina_despues.webp" alt="Después" width="1168" height="880">
    </div>
    <div class="spacer">Baja: el segundo comparador hace su barrido al entrar.</div>
    <div class="k-ba" id="ba2">
      <img class="k-ba-before" src="../closetdoor/img/cocina_antes.webp" alt="Antes" width="1168" height="880" loading="lazy">
      <img class="k-ba-after" src="../closetdoor/img/cocina_despues.webp" alt="Después" width="1168" height="880" loading="lazy">
    </div>
  </div>
</div>
<script src="antesdespues.js"></script>
</body>
</html>
