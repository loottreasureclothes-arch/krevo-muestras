<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo kit KREVO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script src="kit.js" defer></script>
<style>
  :root { --brand: #b3261e; --font-display: "Fraunces", serif; --font-body: "Manrope", system-ui, sans-serif; }
  .hero { min-height: 100svh; display: grid; align-items: end; padding-bottom: 12svh; background: #1b1b1b; color: #fff; }
  .hero h1 { font-size: clamp(3rem, 12vw, 7rem); letter-spacing: -0.03em; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  section.s { padding-block: 96px; }
  section.s h2 { font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -0.02em; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { aspect-ratio: 4/5; border-radius: var(--radius); background: #f4f1ec; border: 1px solid var(--line); display: grid; place-items: end start; padding: 16px; font-weight: 600; }
  footer { padding-block: 48px 120px; color: var(--mute); font-size: 0.9rem; border-top: 1px solid var(--line); }
</style>
</head>
<body data-hero-dark>
<header class="k-header">
  <a class="k-logo" href="#">La Demo</a>
  <nav class="k-nav"><a href="#menu">Menú</a><a href="#galeria">Galería</a><a href="#visitanos">Visítanos</a></nav>
  <a class="k-cta" href="#visitanos">Reservar</a>
</header>

<section class="hero">
  <div class="k-wrap">
    <h1 data-reveal="clip">Hecho a tu medida.</h1>
    <div class="row" data-reveal data-reveal-delay="150">
      <a class="k-btn" href="#">Ver menú</a>
      <a class="k-btn k-btn--ghost" style="color:#fff;border-color:#fff" href="#">Cómo llegar</a>
    </div>
  </div>
</section>

<section class="s" id="menu">
  <div class="k-wrap">
    <h2 data-reveal>Lo de siempre.</h2>
    <p data-reveal data-reveal-delay="120" style="color:var(--mute);max-width:36ch">Bloque de prueba para ver el reveal con retraso de 120 ms.</p>
    <div class="row" data-reveal data-reveal-delay="200">
      <a class="k-btn" href="#">Botón sólido</a>
      <a class="k-btn k-btn--ghost" href="#">Botón ghost</a>
    </div>
  </div>
</section>

<section class="s" id="galeria">
  <div class="k-wrap">
    <h2 data-reveal>Galería.</h2>
    <div class="grid" data-reveal-stagger>
      <div class="card">Uno</div><div class="card">Dos</div><div class="card">Tres</div>
      <div class="card">Cuatro</div><div class="card">Cinco</div><div class="card">Seis</div>
    </div>
  </div>
</section>

<section class="s" id="visitanos">
  <div class="k-wrap">
    <h2 data-reveal="clip">Visítanos.</h2>
    <label data-reveal style="display:grid;gap:8px;max-width:360px">Tu nombre
      <input type="text" style="padding:12px 14px;border:1px solid var(--line);border-radius:12px">
    </label>
  </div>
</section>

<footer><div class="k-wrap">Muestra de diseño hecha por KREVO.</div></footer>

<a class="k-wa" href="https://wa.me/5210000000000?text=Hola" aria-label="WhatsApp"></a>
</body>
</html>
