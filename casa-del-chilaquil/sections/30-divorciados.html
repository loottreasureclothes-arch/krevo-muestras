<section class="cc-sec cc-div" id="divorciados" data-hide-wa>
  <div class="cc-wrap">
    <div class="cc-div-grid">
      <div>
        <p class="cc-eyebrow">Dos salsas, un plato</p>
        <h2 class="cc-h2" data-cc-reveal>Divorciados<em>a tu modo.</em></h2>
        <p class="cc-div-lead">Arrastra los frijoles y reparte el plato entre dos salsas.</p>
        <div class="cc-panel">
          <div class="cc-plate" id="cc-plate" role="img" aria-label="Plato de chilaquiles divorciados que se arma con los controles de abajo">
            <svg viewBox="0 0 400 400" aria-hidden="true">
              <defs>
                <radialGradient id="clay" cx="42%" cy="36%" r="75%"><stop offset="0" stop-color="#c46a3a"/><stop offset="1" stop-color="#7a321a"/></radialGradient>
                <clipPath id="well"><circle cx="200" cy="200" r="150"/></clipPath>
              </defs>
              <circle cx="200" cy="206" r="194" fill="rgba(20,8,10,.35)"/>
              <circle cx="200" cy="200" r="192" fill="#5a2616"/>
              <circle cx="200" cy="200" r="184" fill="url(#clay)"/>
              <circle cx="200" cy="200" r="160" fill="#8b3f22" stroke="#5a2616" stroke-width="3"/>
              <g class="cc-serve">
                <g clip-path="url(#well)">
                  <rect class="cc-salsa-l" id="cc-sl" x="0" y="0" width="200" height="400" fill="#5d8a2c"/>
                  <rect class="cc-salsa-r" id="cc-sr" x="200" y="0" width="200" height="400" fill="#7a1b1d"/>
                  <rect id="cc-frijol" x="187" y="0" width="26" height="400" fill="#3a2216"/>
                  <g id="cc-beans"></g>
                  <g id="cc-chips"></g>
                </g>
                <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="3"/>
                <g id="cc-cebolla"></g>
                <g id="cc-queso"></g>
                <g id="cc-tops"></g>
                <g id="cc-huevos"></g>
              </g>
            </svg>
          </div>
          <span class="cc-plate-hint">Arrastra el plato de lado a lado</span>
          <p class="cc-pname" id="cc-pname">Divorciados<span id="cc-pdesc">mitad verde, mitad morita</span></p>
        </div>
      </div>
      <div class="cc-ctrl">
        <fieldset><legend>Salsa de la izquierda</legend><div class="cc-chips" id="cc-ch-l"><button type="button" class="cc-chip" aria-pressed="false" data-side="l" data-i="0"><i style="background:#7d3a1c"></i>Molcajete</button><button type="button" class="cc-chip" aria-pressed="true" data-side="l" data-i="1"><i style="background:#5d8a2c"></i>Verde</button><button type="button" class="cc-chip" aria-pressed="false" data-side="l" data-i="2"><i style="background:#8c3f1b"></i>Chipotle</button><button type="button" class="cc-chip" aria-pressed="false" data-side="l" data-i="3"><i style="background:#7a1b1d"></i>Morita</button><button type="button" class="cc-chip" aria-pressed="false" data-side="l" data-i="4"><i style="background:#c4302b"></i>Roja</button><button type="button" class="cc-chip" aria-pressed="false" data-side="l" data-i="5"><i style="background:#4b2118"></i>Pasilla</button><button type="button" class="cc-chip" aria-pressed="false" data-side="l" data-i="6"><i style="background:#dd5a38"></i>Jitomate</button></div></fieldset>
        <fieldset><legend>Salsa de la derecha</legend><div class="cc-chips" id="cc-ch-r"><button type="button" class="cc-chip" aria-pressed="false" data-side="r" data-i="0"><i style="background:#7d3a1c"></i>Molcajete</button><button type="button" class="cc-chip" aria-pressed="false" data-side="r" data-i="1"><i style="background:#5d8a2c"></i>Verde</button><button type="button" class="cc-chip" aria-pressed="false" data-side="r" data-i="2"><i style="background:#8c3f1b"></i>Chipotle</button><button type="button" class="cc-chip" aria-pressed="true" data-side="r" data-i="3"><i style="background:#7a1b1d"></i>Morita</button><button type="button" class="cc-chip" aria-pressed="false" data-side="r" data-i="4"><i style="background:#c4302b"></i>Roja</button><button type="button" class="cc-chip" aria-pressed="false" data-side="r" data-i="5"><i style="background:#4b2118"></i>Pasilla</button><button type="button" class="cc-chip" aria-pressed="false" data-side="r" data-i="6"><i style="background:#dd5a38"></i>Jitomate</button></div></fieldset>
        <fieldset><legend>Cuánto de cada una</legend>
          <input class="cc-range" id="cc-range" type="range" min="10" max="90" step="5" value="50" aria-label="Reparto entre la salsa izquierda y la derecha">
          <div class="cc-range-lbl"><span id="cc-pl">50% izquierda</span><span id="cc-pr">50% derecha</span></div>
        </fieldset>
        <fieldset><legend>Huevo</legend><div class="cc-chips" id="cc-ch-h">
          <button type="button" class="cc-chip" aria-pressed="false" data-h="0">Sin huevo</button>
          <button type="button" class="cc-chip" aria-pressed="true" data-h="1">Un huevo</button>
          <button type="button" class="cc-chip" aria-pressed="false" data-h="2">Dos huevos</button></div></fieldset>
        <fieldset><legend>Toppings</legend><div class="cc-chips" id="cc-ch-t"><button type="button" class="cc-chip" aria-pressed="false" data-top="0"><i style="background:#e07a2e"></i>Cochinita pibil</button><button type="button" class="cc-chip" aria-pressed="false" data-top="1"><i style="background:#f2dfba"></i>Pollo</button><button type="button" class="cc-chip" aria-pressed="false" data-top="2"><i style="background:#6a3a22"></i>Res</button><button type="button" class="cc-chip" aria-pressed="false" data-top="3"><i style="background:#b3361f"></i>Chorizo</button><button type="button" class="cc-chip" aria-pressed="false" data-top="4"><i style="background:#d96b5b"></i>Tocino</button><button type="button" class="cc-chip" aria-pressed="false" data-top="5"><i style="background:#eba6a3"></i>Jamón</button><button type="button" class="cc-chip" aria-pressed="false" data-top="6"><i style="background:#c9915f"></i>Salchicha</button></div></fieldset>
        <div class="cc-div-out"><a class="cc-btn cc-btn-wa" id="cc-div-wa" data-wa="" href="{{wa:Hola, vi su página y quiero chilaquiles divorciados: mitad salsa verde, mitad salsa morita, con un huevo. ¿Me confirman precio y cuánto tardan?}}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-wa"/></svg>Pedir este plato</a></div>
      </div>
    </div>
  </div>
</section>
