  <section class="s-banq" id="banquetes" data-dark aria-labelledby="bq-t">
    <div class="k-wrap bq-grid">
      <div class="bq-head">
        <!-- Sin eyebrow ni lead a propósito: cinco secciones seguidas abrían igual (eyebrow → título → lead).
             Aquí manda el título y el "Estilo Hidalgo." de fondo; lo que hace el formulario lo dice su botón. -->
        <h2 id="bq-t" class="lm-h2 lm-h2--xl bq-t" data-drop><span class="bq-l">Tu fiesta,</span> <span class="bq-l">con <em>barbacoa.</em></span></h2>
        <p class="bq-big" aria-hidden="true">Estilo<br>Hidalgo.</p>
      </div>
      <form class="bq-form" id="bq-form" novalidate aria-label="Cotiza tu banquete">
        <p class="bq-k">Banquetes y servicio a domicilio</p>
        <div class="bq-row">
          <label class="lm-field"><span>Fecha</span><input id="bq-fecha" type="date"></label>
          <label class="lm-field"><span>Personas</span><input id="bq-personas" type="number" inputmode="numeric" min="5" max="2000" placeholder="Ej. 50"></label>
        </div>
        <label class="lm-field"><span>Colonia o lugar del evento</span><input id="bq-lugar" type="text" maxlength="80" placeholder="Ej. Jesús María"></label>
        <fieldset class="bq-pl">
          <legend>¿Qué te gustaría servir?</legend>
          <label><input type="checkbox" value="Barbacoa" checked><span>Barbacoa</span></label>
          <label><input type="checkbox" value="Consomé"><span>Consomé</span></label>
          <label><input type="checkbox" value="Mixiote"><span>Mixiote</span></label>
          <label><input type="checkbox" value="Tlacoyos y sopes"><span>Tlacoyos y sopes</span></label>
          <label><input type="checkbox" value="Tamales"><span>Tamales</span></label>
          <label><input type="checkbox" value="Tortillas a mano"><span>Tortillas a mano</span></label>
        </fieldset>
        <button class="lm-btn lm-btn--wa bq-go" type="submit"><svg aria-hidden="true"><use href="#i-wa"/></svg>Cotizar por WhatsApp</button>
        <p class="bq-fallback" hidden>¿No se abrió WhatsApp? <a href="#" target="_blank" rel="noopener">Toca aquí</a></p>
      </form>
    </div>
  </section>
