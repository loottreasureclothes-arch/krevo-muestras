      <!-- Video hecho SOLO con fotos reales (ffmpeg: cámara + disolvencias + grading; receta: tools/hero_video.py).

      <video class="hr-vid" muted playsinline loop preload="metadata" poster="img/foto/salsas-1200.webp" data-src-m="img/hero/hero-m.mp4" data-src-d="img/hero/hero-d.mp4" data-segs="0,3.075,6.325,9.575,12.825" data-fade="0.35"></video>
