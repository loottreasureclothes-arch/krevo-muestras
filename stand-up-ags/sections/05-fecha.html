<section id="fecha" class="s-fecha su-paper" aria-label="Tu feria tiene fecha">
  <div class="k-wrap s-fecha-wrap">
    <h2 class="su-h2 s-fecha-h2">
      <span class="ln">TU FERIA TIENE</span>
      <span class="ln">FECHA.</span>
      <span class="ln"><em>NOSOTROS</em></span>
      <span class="ln"><em>TAMBIÉN.</em></span>
    </h2>

    <form class="s-fecha-form" id="s-fecha-form">
      <label>Medida
        <select id="s-fecha-medida">
          <option value="">Elige una medida</option>
          <option>3×2 Cajón Octanorm</option>
          <option>3×2 Esquina Octanorm</option>
          <option>3×3 Cabecera Custom</option>
          <option>3×3 Cabecera Octanorm</option>
          <option>3×3 Cajón Custom</option>
          <option>3×3 Cajón Octanorm</option>
          <option>3×3 Esquina Custom</option>
          <option>3×3 Esquina Octanorm</option>
          <option>6×3 Cabecera Custom</option>
          <option>6×3 Cabecera Octanorm</option>
          <option>6×3 Cajón Custom</option>
          <option>6×3 Cajón Octanorm</option>
          <option>6×3 Esquina Custom</option>
          <option>6×3 Esquina Octanorm</option>
          <option>Medidas Especiales</option>
        </select>
      </label>
      <label>Fecha de montaje
        <input type="date" id="s-fecha-fecha">
      </label>
      <label>Nombre de la feria o del evento
        <input type="text" id="s-fecha-nombre" placeholder="Ej. EBESA 2026" autocomplete="off">
      </label>
      <button class="cd-btn cd-btn--primary s-fecha-send" type="submit"><svg aria-hidden="true"><use href="#i-wa"/></svg><span>Mandar por WhatsApp</span></button>
      <p class="s-fecha-horario">Lun a vie, 9:00 a 18:00 h.</p>
    </form>
  </div>
</section>
