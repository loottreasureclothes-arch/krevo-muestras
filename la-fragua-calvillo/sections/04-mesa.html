<section class="sec mesa" id="mesa">
  <div class="wrap">
    <p class="eyebrow" data-reveal>Tu hora en la presa</p>
    <h2 data-reveal>Elige tu hora.<span class="t2">Ahí te esperamos.</span></h2>
    <div class="firma" id="firma">
      <div class="col-a">
        <div class="hora-ph" aria-hidden="true">
          <img class="on" src="img/terraza-960.webp" srcset="img/terraza-480.webp 480w, img/terraza-960.webp 960w, img/terraza-1600.webp 1600w" sizes="(min-width:820px) 45vw, 100vw" width="960" height="455" alt="" data-b="0">
          <img src="img/mesa-960.webp" srcset="img/mesa-480.webp 480w, img/mesa-960.webp 960w, img/mesa-1600.webp 1600w" sizes="(min-width:820px) 45vw, 100vw" width="960" height="628" alt="" data-b="1" loading="lazy">
          <img src="img/atardecer-960.webp" srcset="img/atardecer-480.webp 480w, img/atardecer-960.webp 960w, img/atardecer-1600.webp 1600w" sizes="(min-width:820px) 45vw, 100vw" width="960" height="541" alt="" data-b="2" loading="lazy">
          <div class="hora-big"><span id="hora-txt">1:00 pm</span><small id="hora-sub">Terraza</small></div>
        </div>
        <div class="sol" style="margin-top:18px">
          <svg viewBox="0 0 320 130" aria-hidden="true">
            <path class="arc" d="M20 110 A140 140 0 0 1 300 110"/>
            <path class="arc-on" id="arc-on" d="M20 110 A140 140 0 0 1 300 110" pathLength="100" stroke-dasharray="0 100"/>
            <line class="suelo" x1="6" y1="110" x2="314" y2="110"/>
            <circle class="dot" id="dot" cx="20" cy="110" r="11"/>
            <g class="ticks"><text x="20" y="127">11</text><text x="90" y="127">1</text><text x="160" y="127">3</text><text x="230" y="127">5</text><text x="300" y="127">7</text></g>
          </svg>
          <input id="hora" type="range" min="11" max="19" step="0.5" value="13" aria-label="Hora a la que llegas, de 11 de la mañana a 7 de la tarde">
        </div>
        <p class="nota" id="nota" style="margin-top:18px"></p>
      </div>
      <div class="col-b">
        <div class="ctl">
          <div><span class="lbl">Cuándo</span><div class="seg" id="dia"><button type="button" data-d="entre semana" aria-pressed="true">Entre semana</button><button type="button" data-d="domingo" aria-pressed="false">Domingo</button></div></div>
          <div><span class="lbl">Personas</span><div class="step"><button type="button" id="menos" aria-label="Una persona menos">-</button><output id="pers">4</output><button type="button" id="mas" aria-label="Una persona más">+</button></div></div>
        </div>
        <p class="cuenta" id="cuenta"></p>
        <p class="msg" id="msg"></p>
        <div class="acts"><a class="btn btn-f" id="avisa" href="tel:+524959582200">Llamar y avisar</a><button class="btn btn-o" type="button" id="copia">Copiar mensaje</button></div>
        <p class="copied" id="copied" role="status"></p>
      </div>
    </div>
  </div>
</section>
