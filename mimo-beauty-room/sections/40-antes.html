<section class="mm-sec mm-dark s-antes" id="antes" aria-labelledby="s-antes-t">
  <div class="mm-wrap s-antes-cab">
    <h2 class="mm-h2" id="s-antes-t" data-mm-drop>De rebelde a <em>lacio.</em></h2>
    <p class="s-antes-frase" data-mm-reveal>Trabajamos cabellos decolorados.<span>Nuestras fotos tal como las publicamos: una sola imagen partida a la mitad.</span></p>
  </div>

  <div class="s-antes-riel" id="s-antes-riel" tabindex="0" role="group" aria-label="Antes y después, se desliza de lado">
    <figure class="s-dip" data-dip>
      <div class="s-dip-caja">
        <img src="img/ig/dip-alaciado-m.webp" alt="Antes y después de un alaciado: a la izquierda el cabello rebelde, a la derecha lacio" width="900" height="900" loading="lazy" decoding="async">
        <span class="s-dip-tapa" aria-hidden="true"><i>Después</i></span>
        <span class="s-dip-et s-dip-et--a" aria-hidden="true">Antes</span>
        <span class="s-dip-et s-dip-et--d" aria-hidden="true">Después</span>
        <span class="mm-regla s-dip-regla" aria-hidden="true"></span>
      </div>
      <figcaption>Keratina japonesa</figcaption>
    </figure>

    <figure class="s-dip" data-dip>
      <div class="s-dip-caja">
        <img src="img/ig/dip-color-m.webp" alt="Antes y después de un diseño de color: a la izquierda ondulado, a la derecha lacio y con color parejo" width="900" height="900" loading="lazy" decoding="async">
        <span class="s-dip-tapa" aria-hidden="true"><i>Después</i></span>
        <span class="s-dip-et s-dip-et--a" aria-hidden="true">Antes</span>
        <span class="s-dip-et s-dip-et--d" aria-hidden="true">Después</span>
        <span class="mm-regla s-dip-regla" aria-hidden="true"></span>
      </div>
      <figcaption>Diseño de color</figcaption>
    </figure>

    <figure class="s-dip" data-dip>
      <div class="s-dip-caja">
        <img src="img/ig/dip-cejas-m.webp" alt="Antes y después de cejas: a la izquierda el mapeo con hilos, a la derecha la ceja terminada" width="900" height="900" loading="lazy" decoding="async">
        <span class="s-dip-tapa" aria-hidden="true"><i>Después</i></span>
        <span class="s-dip-et s-dip-et--a" aria-hidden="true">Antes</span>
        <span class="s-dip-et s-dip-et--d" aria-hidden="true">Después</span>
        <span class="mm-regla s-dip-regla" aria-hidden="true"></span>
      </div>
      <figcaption>Combo Cejas Full</figcaption>
    </figure>
  </div>

  <div class="mm-wrap mm-riel-pie" data-mm-riel-pie="s-antes-riel">
    <span class="mm-riel-marcas" aria-hidden="true"><i class="is-on"></i><i></i><i></i></span>
    <span class="mm-riel-desliza" aria-hidden="true">Desliza<svg aria-hidden="true"><use href="#i-arrow"/></svg></span>
  </div>

  <div class="mm-wrap s-antes-pie">
    <a class="mm-link" href="#cita" data-mm-servicio="keratina">Agendar mi alaciado<svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
    <p class="mm-credito">Fotos: @mimobeautyroom_ags</p>
  </div>
</section>
