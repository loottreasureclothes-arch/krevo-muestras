<section class="sec mesas" id="mesas">
  <div class="wrap mesas-grid">
    <div class="mesas-hd">
      <span class="eyebrow">Si van en grupo</span>
      <h2 data-reveal>Vienen todos. <span class="t2">Júntenme las mesas.</span></h2>
      <p class="mesas-p">Cuenta a los grandes y a los chicos. Las mesas de 4 se van juntando solas.</p>
    </div>
    <div class="mx" id="mx" data-reveal>
      <div class="mx-ctl">
        <div class="mx-row"><span class="mx-l" id="l-ad"><i class="sw sw-a"></i>Adultos</span>
          <div class="step" role="group" aria-labelledby="l-ad"><button type="button" data-k="ad" data-d="-1" aria-label="Menos adultos"><svg><use href="#i-minus"/></svg></button><output id="o-ad" aria-live="polite">4</output><button type="button" data-k="ad" data-d="1" aria-label="Más adultos"><svg><use href="#i-plus"/></svg></button></div></div>
        <div class="mx-row"><span class="mx-l" id="l-ni"><i class="sw sw-n"></i>Niños</span>
          <div class="step" role="group" aria-labelledby="l-ni"><button type="button" data-k="ni" data-d="-1" aria-label="Menos niños"><svg><use href="#i-minus"/></svg></button><output id="o-ni" aria-live="polite">2</output><button type="button" data-k="ni" data-d="1" aria-label="Más niños"><svg><use href="#i-plus"/></svg></button></div></div>
      </div>
      <div class="mx-floor" id="mx-floor" role="img" aria-label="Mesas juntas para tu grupo"></div>
      <div class="mx-tot" aria-live="polite"><b id="mx-n">2</b><span><em id="mx-u">mesas de 4 juntas</em><small id="mx-pp">6 lugares · 4 adultos y 2 niños</small></span></div>
      <blockquote class="mx-say" id="mx-say"></blockquote>
      <p class="mx-hint" id="mx-hint"></p>
      <div class="end" data-hide-wa>
        <a class="btn btn-brand" id="mx-call" href="tel:+524498135545"><svg class="ico"><use href="#i-tel"/></svg>Llamar y decirlo</a>
        <button class="btn btn-line" id="mx-copy" type="button">Copiar el recado</button>
      </div>
    </div>
  </div>
</section>
