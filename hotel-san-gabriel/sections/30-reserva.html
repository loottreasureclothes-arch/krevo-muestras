  <section class="s-rs sg-sec" id="reserva" data-hide-wa aria-labelledby="rs-t">
    <div class="k-wrap rs-grid">
      <div class="rs-side">
        <p class="sg-eyebrow">Reserva directo</p>
        <h2 id="rs-t" class="sg-d sg-h2 sg-h3d"><span class="sg-l">Elige fechas.</span> <span class="sg-l"><em>Te confirmamos.</em></span></h2>
        <p class="sg-lead">Tu reserva llega directo al hotel por WhatsApp, con fechas y habitación ya escritas.</p>
        <figure class="rs-fig" data-reveal>
          <img src="img/hd/h03-1200.webp" srcset="img/hd/h03-1200.webp 900w, img/hd/h03-2400.webp 2400w" sizes="(min-width: 900px) 36vw, 100vw" width="900" height="1600" alt="Pasillo con ventanal de piso a techo y vista a la catedral" loading="lazy" decoding="async">
        </figure>
      </div>
      <form class="rs-form" id="rs-form" novalidate>
        <label class="sg-field rs-room"><span>Habitación</span>
          <select name="room">
            <option value="">Aún no sé, recomiéndenme</option>
            <option>Habitación sencilla</option>
            <option>Suite con jacuzzi</option>
            <option>Habitación familiar</option>
            <option>Noche romántica (suite decorada)</option>
          </select>
        </label>
        <div class="rs-dates">
          <label class="sg-field"><span>Llegada</span><input type="date" name="in" required></label>
          <label class="sg-field"><span>Salida</span><input type="date" name="out" required></label>
        </div>
        <p class="rs-nights" aria-live="polite"></p>
        <div class="rs-people">
          <div class="sg-field rs-step"><span id="rs-ad">Adultos</span>
            <div class="rs-step-in"><button type="button" data-f="ad" data-s="-1" aria-label="Menos adultos">&minus;</button><output name="ad" aria-labelledby="rs-ad">2</output><button type="button" data-f="ad" data-s="1" aria-label="Más adultos">+</button></div>
          </div>
          <div class="sg-field rs-step"><span id="rs-ni">Niños</span>
            <div class="rs-step-in"><button type="button" data-f="ni" data-s="-1" aria-label="Menos niños">&minus;</button><output name="ni" aria-labelledby="rs-ni">0</output><button type="button" data-f="ni" data-s="1" aria-label="Más niños">+</button></div>
          </div>
        </div>
        <fieldset class="rs-extras"><legend>Extras</legend>
          <div class="rs-chips">
            <button type="button" class="sg-chip" aria-pressed="false" data-v="Pido vista a la catedral">Vista a la catedral</button>
            <button type="button" class="sg-chip" aria-pressed="false" data-v="Decoración romántica">Decoración romántica</button>
            <button type="button" class="sg-chip" aria-pressed="false" data-v="Cena en la esfera de cristal">Cena en la esfera</button>
            <button type="button" class="sg-chip" aria-pressed="false" data-v="Mesa en Top Pool &amp; Bar">Mesa en el Top</button>
          </div>
        </fieldset>
        <label class="sg-field"><span>Tu nombre</span><input type="text" name="nombre" autocomplete="name" placeholder="Nombre y apellido"></label>
        <p class="rs-err" hidden>Revisa las fechas: la salida va después de la llegada.</p>
        <button class="sg-btn sg-btn--wa rs-send" type="submit"><svg aria-hidden="true"><use href="#i-wa"/></svg>Reservar por WhatsApp</button>
        <p class="sg-wa-fb" hidden>¿No se abrió WhatsApp? <a href="https://wa.me/523173892964">Toca aquí</a></p>
        <p class="rs-note">O llama al <a href="tel:+523173892964">317 389 2964</a>.</p>
      </form>
    </div>
  </section>
