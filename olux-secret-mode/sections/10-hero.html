     recortada por clip-path + mascara suave a la zona real del rotulo, que 10-hero.js recalcula en
     cada cuadro para que siga pegada al letrero mientras la camara baja. Beat B:
     ligado al scroll, la cámara baja por la fachada hacia los aparadores (reversible, sin pin).
