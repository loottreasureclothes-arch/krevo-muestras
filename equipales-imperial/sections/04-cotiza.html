  <section id="cotiza" class="s-cot eq-cuero eq-sec" aria-labelledby="cot-t">
    <div class="k-wrap s-cot-wrap">
      <!-- El título y el texto van DENTRO de la tarjeta del formulario, en una sola línea de encabezado:
           así esta sección no arranca igual que #catalogo, #cine y #proyectos (REVISION-10 #23). -->
      <form class="s-cot-form" novalidate data-reveal>
        <div class="s-cot-formhead">
          <h2 id="cot-t" class="s-cot-t cd-h3d" data-title-drop>Cotiza <em>gratis.</em></h2>
          <p class="s-cot-lead">Dinos qué buscas y a dónde lo enviamos. Te contestamos por WhatsApp, sin compromiso.</p>
        </div>
        <label class="eq-field"><span>Tu nombre</span><input class="eq-input" name="nombre" type="text" autocomplete="name" autocapitalize="words" placeholder="Nombre" required></label>
        <label class="eq-field"><span>¿Qué buscas?</span>
          <select class="eq-input" name="busca" required>
            <option value="" selected disabled>Elige una opción</option>
            <option>Asientos o mecedoras</option>
            <option>Cantineros</option>
            <option>Sala</option>
            <option>Comedor</option>
            <option>Mesa</option>
            <option>Barra</option>
            <option>Complementos (biombo, buró, cabecera)</option>
            <option>Equipar mi restaurante o bar</option>
            <option>Una pieza a medida</option>
          </select>
        </label>
        <label class="eq-field"><span>Ciudad o código postal</span><input class="eq-input" name="cp" type="text" autocomplete="postal-code" placeholder="Ej. 44100 o Monterrey" required></label>
        <p class="s-cot-err" role="alert" hidden>Llena los tres datos para cotizarte.</p>
        <button type="submit" class="cd-btn cd-btn--primary s-cot-send"><svg aria-hidden="true"><use href="#i-wa"/></svg>Enviar por WhatsApp</button>
        <p class="s-cot-alt">O llama al <a href="tel:+523312670824" class="cd-nowrap">33 1267 0824</a></p>
      </form>
    </div>
  </section>
