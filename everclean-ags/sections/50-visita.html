<section class="s-visita ec-sec ec-sec--papel" id="50-visita" aria-label="Apartar visita">
  <div class="ec-wrap s-visita-grid">
    <div class="ec-frame s-visita-foto">
      <div class="ec-frame__pic">
        <picture>
          <source srcset="img/visita/exterior-d.webp" media="(min-width: 720px)">
          <img src="img/visita/exterior-m.webp" alt="Sillón recién lavado a vapor en el patio de un cliente, foto real de Everclean." width="720" height="1280" loading="lazy">
        </picture>
      </div>
      <span class="ec-frame__tag">Vamos a tu casa</span>
    </div>

    <div class="s-visita-copy">
      <h2 class="ec-h2" data-ec-drop>
        <span class="s-visita-line1">Junta todo</span>
        <span class="ec-tono2">en una sola visita.</span>
      </h2>
      <p class="s-visita-lead">Servicio a domicilio gratis.</p>

      <div class="s-visita-box">
        <div class="s-visita-resumen" id="s-visita-resumen"></div>

        <label class="s-visita-field">
          <span>¿En qué colonia o zona?</span>
          <input type="text" id="s-visita-zona" name="zona" autocomplete="address-level3" placeholder="Ej. Bosques del Prado">
        </label>

        <div class="s-visita-dia">
          <span class="s-visita-dia-label">¿Qué día?</span>
          <div class="s-visita-dia-btns" role="group" aria-label="Qué día prefieres">
            <button type="button" class="s-visita-dia-btn" data-dia="Entre semana" aria-pressed="false">Entre semana</button>
            <button type="button" class="s-visita-dia-btn" data-dia="Sábado" aria-pressed="false">Sábado</button>
            <button type="button" class="s-visita-dia-btn is-active" data-dia="Domingo" aria-pressed="true">Domingo</button>
          </div>
        </div>

        <p class="s-visita-total">Total: <strong>te lo confirmamos por WhatsApp</strong></p>

        <button type="button" class="ec-btn ec-btn--wa s-visita-send" id="s-visita-send">
          <svg aria-hidden="true"><use href="#i-wa"/></svg>Mandar mi visita por WhatsApp
        </button>
      </div>
    </div>
  </div>
</section>
