<section class="sec rincon" id="rincon" data-hide-wa>
  <div class="in">
    <span class="eb" data-reveal>Reserva tu mesa</span>
    <h2 data-reveal>Elige tu rincón <span class="t2">y avísanos.</span></h2>
    <div class="rc">
      <div class="rc-stage">
        <div class="rc-win arco" id="rcWin"><img id="rcImg" src="img/mesa-960.webp" srcset="img/mesa-480.webp 480w, img/mesa-960.webp 960w, img/mesa-1600.webp 1600w" sizes="(min-width:820px) 40vw, 90vw" alt="Mesa larga con velas y cempasúchil" width="2048" height="1365"></div>
        <p class="rc-cap"><b id="rcName">Mesa larga con velas</b><span id="rcSub">Para llegar en grupo.</span></p>
      </div>
      <div class="rc-ctl">
        <fieldset><legend>1. Rincón</legend>
          <div class="opts" role="radiogroup" aria-label="Rincón">
            <button type="button" role="radio" aria-checked="true" data-k="mesa">Mesa larga</button>
            <button type="button" role="radio" aria-checked="false" data-k="piedra">Terraza de piedra</button>
            <button type="button" role="radio" aria-checked="false" data-k="barra">Terraza azul</button>
          </div>
        </fieldset>
        <fieldset><legend>2. Día</legend><div class="days" id="rcDays"></div></fieldset>
        <fieldset><legend>3. Hora</legend><div class="hours" id="rcHours"></div></fieldset>
        <fieldset><legend>4. Personas</legend>
          <div class="step"><button type="button" id="rcMinus" aria-label="Una persona menos">&minus;</button><output id="rcN">4</output><button type="button" id="rcPlus" aria-label="Una persona más">+</button></div>
        </fieldset>
      </div>
      <div class="ticket" aria-live="polite">
        <p class="tk-h">Tu reservación</p>
        <p class="tk-big" id="tkBig">Mesa para 4</p>
        <ul class="tk-l"><li id="tkDia"></li><li id="tkHora"></li><li id="tkRin"></li><li id="tkPla"></li></ul>
        <a class="btn wa" id="rcWa" data-wa="Hola, Rosa Mexicano. Quiero reservar una mesa." href="https://wa.me/524959560095?text=Hola%2C%20Rosa%20Mexicano.%20Quiero%20reservar%20una%20mesa."><svg><use href="#i-wa"/></svg>Pedir mi mesa</a>
        <a class="lnk" href="tel:+524959560095">Mejor llamar al 495 956 0095</a>
      </div>
    </div>
  </div>
</section>
