<section class="mesa" id="mesa">
  <div class="wrap">
    <p class="eyebrow" data-reveal>Pon tu mesa a bordo</p>
    <h2 class="t2" data-reveal>Arma tu mesa,<span>luego llámanos</span></h2>
    <p class="mesa-p" data-reveal>Toca los platos, sube a tu gente a bordo y dicta la comanda por teléfono.</p>
    <div class="mesa-grid">
      <div class="mesa-izq">
        <div class="pers" data-reveal><span class="pers-l">A bordo<small>personas en la mesa</small></span><button type="button" class="pm" data-pers="-1" aria-label="Una persona menos">&minus;</button><output class="pers-n" id="pers-n">2</output><button type="button" class="pm" data-pers="1" aria-label="Una persona más">+</button></div>
        <div class="mesa-t" id="mesa-t" role="img" aria-label="Mesa vista desde arriba con los platos que elegiste">
          <div class="mesa-top"><p class="mesa-v" id="mesa-v">Mesa vacía. Toca un plato</p></div>
        </div>
      </div>
      <div class="mesa-der">
        <div class="ths" role="group" aria-label="Platillos para la mesa"><button class="th" type="button" data-th="caldo" aria-label="Poner Caldo de mariscos en la mesa"><span class="th-ph"><img src="img/caldo-960.webp" srcset="img/caldo-480.webp 480w, img/caldo-960.webp 960w, img/caldo-1600.webp 1600w" sizes="80px" alt="" width="1600" height="1600" loading="lazy"></span><span class="th-n">Caldo de mariscos</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="camarones" aria-label="Poner Camarones en salsa amarilla en la mesa"><span class="th-ph"><img src="img/camarones-960.webp" srcset="img/camarones-480.webp 480w, img/camarones-960.webp 960w, img/camarones-1600.webp 1600w" sizes="80px" alt="" width="1600" height="1200" loading="lazy"></span><span class="th-n">Camarones en salsa amarilla</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="aguachile" aria-label="Poner Torre de aguachile en la mesa"><span class="th-ph"><img src="img/aguachile-960.webp" srcset="img/aguachile-480.webp 480w, img/aguachile-960.webp 960w" sizes="80px" alt="" width="960" height="1280" loading="lazy"></span><span class="th-n">Torre de aguachile</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="sizzler" aria-label="Poner Sizzler de carne en la mesa"><span class="th-ph"><img src="img/sizzler-960.webp" srcset="img/sizzler-480.webp 480w, img/sizzler-960.webp 960w" sizes="80px" alt="" width="960" height="1281" loading="lazy"></span><span class="th-n">Sizzler de carne</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="sizzlerq" aria-label="Poner Sizzler con queso y pimientos en la mesa"><span class="th-ph"><img src="img/sizzler-queso-960.webp" srcset="img/sizzler-queso-480.webp 480w, img/sizzler-queso-960.webp 960w, img/sizzler-queso-1600.webp 1600w" sizes="80px" alt="" width="1600" height="1200" loading="lazy"></span><span class="th-n">Sizzler con queso y pimientos</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="hamb" aria-label="Poner Hamburguesa con papas en la mesa"><span class="th-ph"><img src="img/hamburguesa-960.webp" srcset="img/hamburguesa-480.webp 480w, img/hamburguesa-960.webp 960w, img/hamburguesa-1600.webp 1600w" sizes="80px" alt="" width="1600" height="1200" loading="lazy"></span><span class="th-n">Hamburguesa con papas</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="michec" aria-label="Poner Michelada con camarón en la mesa"><span class="th-ph"><img src="img/michelada-960.webp" srcset="img/michelada-480.webp 480w, img/michelada-960.webp 960w, img/michelada-1600.webp 1600w" sizes="80px" alt="" width="1536" height="2048" loading="lazy"></span><span class="th-n">Michelada con camarón</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="michem" aria-label="Poner Michelada con mejillones en la mesa"><span class="th-ph"><img src="img/michelada-mejillon-960.webp" srcset="img/michelada-mejillon-480.webp 480w, img/michelada-mejillon-960.webp 960w" sizes="80px" alt="" width="960" height="1280" loading="lazy"></span><span class="th-n">Michelada con mejillones</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="copa" aria-label="Poner Postre en copa en la mesa"><span class="th-ph"><img src="img/copa-960.webp" srcset="img/copa-480.webp 480w, img/copa-960.webp 960w, img/copa-1600.webp 1600w" sizes="80px" alt="" width="1536" height="2048" loading="lazy"></span><span class="th-n">Postre en copa</span><span class="th-q" hidden></span></button><button class="th" type="button" data-th="flan" aria-label="Poner Flan con cereza en la mesa"><span class="th-ph"><img src="img/flan-960.webp" srcset="img/flan-480.webp 480w, img/flan-960.webp 960w, img/flan-1600.webp 1600w" sizes="80px" alt="" width="1536" height="2048" loading="lazy"></span><span class="th-n">Flan con cereza</span><span class="th-q" hidden></span></button></div>
        <div class="tk" id="tk">
          <div class="tk-top"><p class="tk-h">Comanda de a bordo</p><p class="tk-m" id="tk-m">Mesa para 2</p></div>
          <ul class="tk-l" id="tk-l"></ul>
          <p class="tk-e" id="tk-e">Elige arriba</p>
          <p class="tk-f">Los precios los confirman por teléfono.</p>
          <div class="tk-b">
            <a class="btn" id="tk-call" href="tel:+524659580786"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>Llamar y dictar</a>
            <button class="btn ghost" type="button" id="tk-copy">Copiar pedido</button>
            <button class="link-b" type="button" id="tk-clr">Vaciar mesa</button>
          </div>
          <p class="tk-ok" id="tk-ok" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </div>
</section>
