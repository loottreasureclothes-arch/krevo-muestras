<section class="sec cordon" id="cordon">
 <div class="wrap">
  <div class="cord-head">
   <p class="eyebrow">Arma tu mesa</p>
   <h2 class="h2">Cuelga lo que <span class="t2">se te antoja.</span></h2>
   <p class="lede">Toca las banderitas. Abajo se arma tu mesa para leerla por teléfono o copiarla.</p>
  </div>
  <div class="cord-flags" id="cord-flags">
   <button class="cflag" type="button" data-id="div" style="--c:#ecb23e" aria-pressed="false"><span class="cf-n">Chilaquiles divorciados</span><span class="cf-s">Colgar</span></button>
   <button class="cflag" type="button" data-id="verde" style="--c:#c2459a" aria-pressed="false"><span class="cf-n">Chilaquiles verdes con huevo</span><span class="cf-s">Colgar</span></button>
   <button class="cflag" type="button" data-id="enchi" style="--c:#3d9bc4" aria-pressed="false"><span class="cf-n">Enchiladas</span><span class="cf-s">Colgar</span></button>
   <button class="cflag" type="button" data-id="jamon" style="--c:#5fb58a" aria-pressed="false"><span class="cf-n">Huevo con jamón</span><span class="cf-s">Colgar</span></button>
   <button class="cflag" type="button" data-id="frij" style="--c:#d9534a" aria-pressed="false"><span class="cf-n">Frijoles con queso</span><span class="cf-s">Colgar</span></button>
   <button class="cflag" type="button" data-id="churro" style="--c:#ecb23e" aria-pressed="false"><span class="cf-n">Churros</span><span class="cf-s">Colgar</span></button>
   <button class="cflag" type="button" data-id="licu" style="--c:#c2459a" aria-pressed="false"><span class="cf-n">Licuados</span><span class="cf-s">Colgar</span></button>
  </div>
  <div class="mesa" aria-live="polite">
   <div class="mesa-pic arch" id="mesa-pic">
    <img src="img/div-960.webp" width="1080" height="720" alt="Chilaquiles con fruta y café" class="mp on" data-id="div">
    <img src="img/verde-960.webp" width="2048" height="1536" alt="Chilaquiles verdes con huevo" class="mp" data-id="verde" loading="lazy">
    <img src="img/enchi-960.webp" width="1536" height="2048" alt="Enchiladas en cazuela" class="mp" data-id="enchi" loading="lazy">
    <img src="img/jamon-960.webp" width="1536" height="2048" alt="Huevo con jamón y chilaquiles" class="mp" data-id="jamon" loading="lazy">
    <img src="img/frij-960.webp" width="1536" height="2048" alt="Frijoles con queso en cazuela" class="mp" data-id="frij" loading="lazy">
    <img src="img/churro-960.webp" width="1536" height="2048" alt="Churros" class="mp" data-id="churro" loading="lazy">
    <img src="img/licu-960.webp" width="1536" height="2048" alt="Platos y licuados en mesa del patio" class="mp" data-id="licu" loading="lazy">
   </div>
   <div class="mesa-tk">
    <h3>Tu mesa</h3>
    <div class="bunting" id="bunting" aria-hidden="true"></div>
    <ul class="tk" id="tk"></ul>
    <p class="tk-empty" id="tk-empty">Elige arriba</p>
    <div class="tk-tot"><span>Total</span><b id="tk-total">Elige arriba</b></div>
    <div class="tk-btns">
     <a class="btn btn-call" href="tel:+524499941977"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg> Llamar y pedir</a>
     <button class="btn btn-line" type="button" id="tk-copy">Copiar mi pedido</button>
    </div>
    <p class="tk-msg" id="tk-msg" role="status"></p>
    <button class="tk-clear" type="button" id="tk-clear" hidden>Quitar todo</button>
   </div>
  </div>
 </div>
</section>
