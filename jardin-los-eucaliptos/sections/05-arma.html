<section class="arma" id="arma">
  <div class="wrap">
    <p class="eyebrow">Las nueve horas</p>
    <h2 class="h2" data-reveal>Arma tu día, <em>hora por hora.</em></h2>
    <p class="lead">Elige qué quieres vivir. La barra se llena con tus 9 horas de jardín.</p>
  </div>
  <div class="nh" id="nh">
    <div class="nh-top">
      <fieldset class="nh-f"><legend>1 · ¿Qué celebras?</legend>
        <div class="seg" id="nh-evento" role="radiogroup">
          <button type="button" role="radio" aria-checked="true" data-v="Boda">Boda</button>
          <button type="button" role="radio" aria-checked="false" data-v="XV años">XV años</button>
          <button type="button" role="radio" aria-checked="false" data-v="Bautizo o comunión">Bautizo o comunión</button>
          <button type="button" role="radio" aria-checked="false" data-v="Cumpleaños o empresa">Cumpleaños o empresa</button>
        </div>
      </fieldset>
      <fieldset class="nh-f"><legend>2 · ¿A qué hora empieza?</legend>
        <div class="seg seg-4" id="nh-inicio" role="radiogroup">
          <button type="button" role="radio" aria-checked="false" data-v="14">2 pm</button>
          <button type="button" role="radio" aria-checked="false" data-v="15">3 pm</button>
          <button type="button" role="radio" aria-checked="true" data-v="16">4 pm</button>
          <button type="button" role="radio" aria-checked="false" data-v="17">5 pm</button>
        </div>
      </fieldset>
      <div class="nh-f">
        <label for="nh-inv" class="nh-lab">3 · ¿Cuántos invitados? <b id="nh-inv-v">150</b></label>
        <input type="range" id="nh-inv" min="50" max="500" step="10" value="150">
        <div class="rng"><span>50</span><span>500</span></div>
      </div>
    </div>

    <div class="nh-stage">
      <figure class="nh-ph" id="nh-ph" aria-live="polite">
        <img id="nh-img" src="img/altar-960.webp" width="1227" height="818" alt="La capilla en A del jardín">
        <figcaption id="nh-cap">La capilla</figcaption>
      </figure>
      <div class="nh-bar-w">
        <div class="nh-bar" id="nh-bar" aria-hidden="true"></div>
        <div class="nh-clock" id="nh-clock" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="nh-left" id="nh-left" role="status"></p>
      </div>
      <ul class="nh-blocks" id="nh-blocks">
        <li><button type="button" class="blk is-on" data-k="cer" data-h="1" aria-pressed="true"><span class="blk-dot" style="--c:#f0c987"></span><span class="blk-n">Ceremonia</span><span class="blk-h">1 h</span></button></li>
        <li><button type="button" class="blk is-on" data-k="coc" data-h="1" aria-pressed="true"><span class="blk-dot" style="--c:#9fb0ff"></span><span class="blk-n">Cóctel de bienvenida</span><span class="blk-h">1 h</span></button></li>
        <li><button type="button" class="blk" data-k="bri" data-h="1" aria-pressed="false"><span class="blk-dot" style="--c:#c9a7ff"></span><span class="blk-n">Fotos y brindis</span><span class="blk-h">1 h</span></button></li>
        <li><button type="button" class="blk is-on" data-k="ban" data-h="2" aria-pressed="true"><span class="blk-dot" style="--c:#f6efe0"></span><span class="blk-n">Banquete</span><span class="blk-h">2 h</span></button></li>
        <li class="blk-li-baile">
          <button type="button" class="blk is-on" data-k="bai" data-h="3" aria-pressed="true"><span class="blk-dot" style="--c:#e08aa8"></span><span class="blk-n">Baile</span><span class="blk-h" id="bai-h">3 h</span></button>
          <span class="step" id="bai-step"><button type="button" aria-label="Una hora menos de baile" data-d="-1">−</button><button type="button" aria-label="Una hora más de baile" data-d="1">+</button></span>
        </li>
        <li><button type="button" class="blk" data-k="des" data-h="1" aria-pressed="false"><span class="blk-dot" style="--c:#7fd0b4"></span><span class="blk-n">Cena de desvelados</span><span class="blk-h">1 h</span></button></li>
      </ul>
    </div>

    <div class="ticket" id="nh-ticket" aria-live="polite">
      <div class="tk-head"><span>Tu día en Eucaliptos</span><span id="tk-meta"></span></div>
      <ol class="tk-lines" id="tk-lines"></ol>
      <p class="tk-foot" id="tk-foot"></p>
      <div class="tk-act">
        <a class="btn btn-gold" href="tel:+524495455102"><svg width="18" height="18" aria-hidden="true"><use href="#i-phone"/></svg>Llamar y apartar</a>
        <button type="button" class="btn btn-line" id="tk-copy">Copiar mi día</button>
      </div>
      <p class="tk-ok" id="tk-ok" role="status"></p>
    </div>
  </div>
</section>
