<section class="barra" id="barra" aria-labelledby="barra-h">
  <i class="m-frostline" aria-hidden="true"></i>
  <div class="barra-grid m-wrap">
    <h2 class="m-title barra-h" id="barra-h" data-words><span class="ln">Así llega.</span><span class="ln ln--g">Así queda.</span></h2>

    <figure class="sweep m-ph m-ph--tr" id="sweep">
      <div class="m-ph-in sweep-stage">
        <img class="sw-a" src="img/llega-768.webp" srcset="img/llega-480.webp 480w, img/llega-768.webp 768w" sizes="(max-width: 759px) calc(100vw - 40px), 520px" width="768" height="960" alt="La barra plegada, sobre el techo de un auto, camino al evento" decoding="async">
        <div class="sw-reveal">
          <img class="sw-b" src="img/queda-768.webp" srcset="img/queda-480.webp 480w, img/queda-768.webp 768w" sizes="(max-width: 759px) calc(100vw - 40px), 520px" width="768" height="960" alt="La misma barra ya montada en un rancho, con su logo dorado al frente" decoding="async">
        </div>
        <i class="sw-ring" aria-hidden="true"></i>
        <figcaption class="sw-tag" aria-live="off"><span class="ta">Así llega</span><span class="tb">Así queda</span></figcaption>
        <div class="sw-thumb" aria-hidden="true"><img src="img/llega-480.webp" alt="" width="480" height="600" loading="eager"><span>Así llega</span></div>
      </div>
      <i class="m-ring" aria-hidden="true"></i>
    </figure>

    <div class="pone" data-reveal>
      <div class="pone-col">
        <p class="pone-h">Él pone</p>
        <ul><li>la barra</li><li>el hielo</li><li>los vasos</li><li>los ingredientes</li><li>el servicio</li></ul>
      </div>
      <div class="pone-col pone-col--tu">
        <p class="pone-h">Tú pones</p>
        <ul><li>la cerveza</li></ul>
        <p class="m-hand pone-q">«Nosotros no vendemos la cerveza, ellos la traen y aquí se la ponemos»</p>
      </div>
    </div>

    <div class="barra-fotos" data-reveal>
      <figure class="bf-frente m-ph m-ph--bl">
        <div class="m-ph-in"><img src="img/frente-720.webp" srcset="img/frente-480.webp 480w, img/frente-720.webp 720w, img/frente-1080.webp 1080w" sizes="(max-width: 759px) calc(100vw - 40px), 360px" width="1080" height="1056" alt="La barra negra y de madera, vista de frente, con el logo dorado de mr. MICHEvy" decoding="async"></div>
        <i class="m-ring" aria-hidden="true"></i>
      </figure>
      <figure class="bf-mesa">
        <div class="m-ph-in"><img src="img/mesa-480.webp" srcset="img/mesa-480.webp 480w, img/mesa-720.webp 720w" sizes="(max-width: 759px) 62vw, 260px" width="1080" height="616" alt="La mesa de ingredientes por detrás: tarros de chile y chamoy, canastas y limones" decoding="async"></div>
        <span class="m-sticker m-sticker--lg bf-st"><span>Condimentos hechos por él</span></span>
      </figure>
    </div>
  </div>
</section>
