<section class="barra" id="barra" aria-labelledby="barra-h">
  <i class="m-frostline" aria-hidden="true"></i>
  <div class="barra-grid m-wrap">
    <h2 class="m-title barra-h" id="barra-h" data-words><span class="ln">Así llega.</span><span class="ln ln--g">Así queda.</span></h2>

    <figure class="sweep m-ph m-ph--tr" id="sweep">
      <div class="m-ph-in sweep-stage">
        <img class="sw-a" src="img/llega-768.webp" srcset="img/llega-480.webp 480w, img/llega-768.webp 768w" sizes="(max-width: 759px) calc(100vw - 40px), 520px" width="768" height="768" alt="La barra plegada con su logo, sobre el techo de un auto, camino al evento" decoding="async">
        <div class="sw-reveal">
          <img class="sw-b" src="img/queda-768.webp" srcset="img/queda-480.webp 480w, img/queda-768.webp 768w" sizes="(max-width: 759px) calc(100vw - 40px), 520px" width="768" height="768" alt="La misma barra ya montada en un rancho, con su logo dorado al frente" decoding="async">
        </div>
        <i class="sw-ring" aria-hidden="true"></i>
        <figcaption class="sw-tag" aria-live="off"><span class="ta">Así llega</span><span class="tb">Así queda</span></figcaption>
        <div class="sw-thumb" aria-hidden="true"><img src="img/llega-480.webp" alt="" width="480" height="480" loading="eager"><span>Así llega</span></div>
      </div>
      <i class="m-ring" aria-hidden="true"></i>
    </figure>

    <div class="pone" data-reveal>
      <div class="pone-col">
        <p class="pone-h">Él pone</p>
        <ul><li>la barra</li><li>el hielo</li><li>los vasos</li><li>los ingredientes</li><li>el servicio</li></ul>
      </div>
      <div class="pone-col pone-col--tu">
        <p class="pone-h">Tú pones</p>
        <ul><li>la cerveza</li></ul>
        <p class="m-hand pone-q">«Nosotros no vendemos la cerveza, ellos la traen y aquí se la ponemos»</p>
      </div>
    </div>

    <div class="barra-fotos" data-reveal>
      <figure class="bf-frente m-ph m-ph--bl">
        <div class="m-ph-in"><img src="img/frente-750.webp" srcset="img/frente-480.webp 480w, img/frente-750.webp 750w" sizes="(max-width: 759px) 72vw, 330px" width="750" height="938" alt="La barra negra con cubierta de madera y el logo dorado de mr. MICHEvy" decoding="async"></div>
        <i class="m-ring" aria-hidden="true"></i>
      </figure>
      <figure class="bf-chile">
        <div class="m-ph-in"><img src="img/chile-720.webp" srcset="img/chile-480.webp 480w, img/chile-720.webp 720w, img/chile-1000.webp 1000w" sizes="(max-width: 759px) 70vw, 340px" width="1000" height="370" alt="El borde de chile de su michelada, de cerca: granos de chile, semillas y especias" decoding="async"></div>
        <span class="m-sticker bf-st"><span>Condimentos hechos por él</span></span>
      </figure>
    </div>
  </div>
</section>
