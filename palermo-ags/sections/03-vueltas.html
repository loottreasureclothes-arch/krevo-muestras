<section class="pl-sec pl-vu-sec" id="vueltas">
  <div class="pl-in">
    <div class="pl-vu-head">
      <p class="pl-eyebrow" data-reveal>Antes de ir</p>
      <h2 class="pl-h" data-reveal="2">Planea<em>tus vueltas.</em></h2>
      <p class="pl-lead" data-reveal="3">Toca una rebanada y elige qué lleva esa vuelta.</p>
    </div>
    <div class="pl-vu" id="pl-vu" data-reveal>
      <div class="pl-vu-wheel">
        <svg id="pl-vu-svg" viewBox="0 0 240 240" role="group" aria-label="Pizza de rebanadas, una por vuelta"></svg>
      </div>
      <div class="pl-vu-side">
        <p class="pl-vu-now" id="pl-vu-now" aria-live="polite">Vuelta 1: elige abajo</p>
        <div class="pl-chips" id="pl-vu-chips" role="group" aria-label="Rebanadas"></div>
        <div class="pl-vu-plan">
          <div class="pl-vu-plan-h"><span>Mi plan</span><button type="button" class="pl-vu-clear" id="pl-vu-clear">Vaciar</button></div>
          <p class="pl-vu-empty" id="pl-vu-empty">Elige arriba</p>
          <ol class="pl-vu-list" id="pl-vu-list"></ol>
        </div>
        <div class="pl-cta">
          <a class="pl-btn pl-btn-red" href="tel:+524494120866">Llamar</a>
          <button type="button" class="pl-btn pl-btn-line" id="pl-vu-copy" disabled>Elige arriba</button>
        </div>
        <p class="pl-vu-note" id="pl-vu-note" aria-live="polite">Tu plan es solo tuyo. Al llegar, pregunta cuáles salieron hoy.</p>
      </div>
    </div>
  </div>
</section>
