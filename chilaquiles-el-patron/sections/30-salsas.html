<section class="ep-sec ep-salsas ep-on-pink" id="salsas" aria-labelledby="ep-h-salsas">
  <div class="ep-wrap">
    <h2 class="ep-title ep-title--lg" id="ep-h-salsas" data-words><span class="ep-ln">Elige tu</span><span class="ep-ln ep-red">salsa.</span></h2>
    <div class="ep-salsas-grid">
      <div class="ep-salsas-rows" id="ep-salsas-rows">
        <div class="ep-salsa" data-salsa="Verde" style="--to:.12">
          <h3 class="ep-salsa-name">Verde</h3>
          <div class="ep-scale" role="img" aria-label="En la escala de su menú, la verde queda al principio"><span class="ep-scale-fill ep-scale-fill--green"></span><span class="ep-knob"><svg aria-hidden="true"><use href="#i-chile"/></svg></span></div>
          <div class="ep-salsa-foot"><p class="ep-salsa-note">La verde de la casa.</p><button type="button" class="ep-anotar ep-link" data-set-salsa="Verde"><span>Anotar esta</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
        </div>
        <div class="ep-salsa" data-salsa="Roja" style="--to:.12">
          <h3 class="ep-salsa-name">Roja</h3>
          <div class="ep-scale" role="img" aria-label="En la escala de su menú, la roja queda al principio"><span class="ep-scale-fill ep-scale-fill--green"></span><span class="ep-knob"><svg aria-hidden="true"><use href="#i-chile"/></svg></span></div>
          <div class="ep-salsa-foot"><p class="ep-salsa-note">La roja de la casa.</p><button type="button" class="ep-anotar ep-link" data-set-salsa="Roja"><span>Anotar esta</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
        </div>
        <div class="ep-salsa" data-salsa="Molcajete" style="--to:.88">
          <h3 class="ep-salsa-name">Molcajete</h3>
          <div class="ep-scale" role="img" aria-label="En la escala de su menú, la molcajete queda casi al tope"><span class="ep-scale-fill ep-scale-fill--hot"></span><span class="ep-knob"><svg aria-hidden="true"><use href="#i-chile"/></svg></span></div>
          <div class="ep-salsa-foot"><p class="ep-salsa-note">La que más pica en la escala de su menú.</p><button type="button" class="ep-anotar ep-link" data-set-salsa="Molcajete"><span>Anotar esta</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
          <p class="ep-salsa-quote">«prueben los chilaquiles con la salsa molcajete»<small>Raul Adrian Mendez, en Google Maps</small></p>
        </div>
      </div>
      <figure class="ep-plate ep-salsas-pic" data-reveal>
        <img src="img/salsas-960.webp" srcset="img/salsas-480.webp 480w, img/salsas-960.webp 960w" sizes="(min-width: 900px) 440px, calc(100vw - 48px)" width="960" height="683" alt="Las dos salsas de la mesa en pocillos negros, verde y roja" decoding="async">
        <figcaption class="ep-label">Las dos de la mesa</figcaption>
      </figure>
    </div>
  </div>
</section>
