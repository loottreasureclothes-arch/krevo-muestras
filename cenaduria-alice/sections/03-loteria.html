<section class="lt" id="loteria" aria-labelledby="lt-t">
  <div class="wrap lt-grid">
    <div class="lt-head" data-reveal>
      <span class="eyebrow">Tu cena en lotería</span>
      <h2 class="tit" id="lt-t">Marca tu cena<em>con frijolitos</em></h2>
      <p class="lead">Un toque pone un frijol, tres platos máximo por carta. Cuando termines, llámanos.</p>
    </div>
    <div class="lt-board" role="group" aria-label="Tablero de lotería con los platos">
      <button type="button" class="lt-card" data-name="Pozole rojo" aria-pressed="false"><span class="lt-n">1</span><img src="img/sq-pozole-rojo-480.webp" alt="" width="480" height="480"><b>El pozole rojo</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card" data-name="Pozole verde" aria-pressed="false"><span class="lt-n">2</span><img src="img/sq-pozole-verde2-480.webp" alt="" width="480" height="480"><b>El pozole verde</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card" data-name="Enchiladas" aria-pressed="false"><span class="lt-n">3</span><img src="img/sq-enchiladas2-480.webp" alt="" width="480" height="480"><b>Las enchiladas</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card" data-name="Carne asada con nopales" aria-pressed="false"><span class="lt-n">4</span><img src="img/sq-carne-480.webp" alt="" width="480" height="480"><b>La carne asada</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card" data-name="Tostadas" aria-pressed="false"><span class="lt-n">5</span><img src="img/sq-tostadas-480.webp" alt="" width="480" height="480"><b>Las tostadas</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card lt-txt c-y" data-name="Sopes" aria-pressed="false"><span class="lt-n">6</span><i aria-hidden="true">S</i><b>Los sopes</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card lt-txt c-b" data-name="Flautas" aria-pressed="false"><span class="lt-n">7</span><i aria-hidden="true">F</i><b>Las flautas</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card lt-txt c-p" data-name="Huaraches" aria-pressed="false"><span class="lt-n">8</span><i aria-hidden="true">H</i><b>Los huaraches</b><span class="lt-beans"></span></button>
      <button type="button" class="lt-card lt-txt c-r" data-name="Chimichangas" aria-pressed="false"><span class="lt-n">9</span><i aria-hidden="true">C</i><b>Las chimichangas</b><span class="lt-beans"></span></button>
    </div>
    <div class="lt-ticket" data-reveal>
      <h3>Tu cena</h3>
      <ul class="lt-lines" aria-live="polite"></ul>
      <p class="lt-empty">Elige arriba</p>
      <p class="lt-stamp" hidden>¡Lotería! Línea completa</p>
      <div class="lt-acts">
        <a class="btn lt-call" href="tel:+524492584516"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg>Llamar y pedir</a>
        <button type="button" class="btn btn--line lt-copy" disabled aria-disabled="true">Copiar mi pedido</button>
      </div>
      <p class="lt-say" role="status"></p>
    </div>
  </div>
</section>
