<section id="sonrisa" class="smile">
  <div class="wrap smile-grid">
    <div class="smile-hd">
      <p class="eye" data-reveal><svg><use href="#i-bracket"/></svg>Tu sonrisa hoy</p>
      <h2 class="t" data-reveal>Marca lo que<span>quieres cambiar.</span></h2>
      <p class="smile-sub" data-reveal>Elige qué te molesta y toca tus dientes. Le llega al Dr. Ilich ya armado.</p>
    </div>
    <div class="smile-tool" data-reveal>
      <div class="modes" role="radiogroup" aria-label="Qué te molesta">
        <button type="button" role="radio" aria-checked="true" data-mode="chuecos" class="mode is-on"><i style="--c:#5fe0e6">C</i>Chuecos</button>
        <button type="button" role="radio" aria-checked="false" data-mode="separados" class="mode"><i style="--c:#ffd166">S</i>Separados</button>
        <button type="button" role="radio" aria-checked="false" data-mode="manchados" class="mode"><i style="--c:#d9a066">M</i>Manchados</button>
        <button type="button" role="radio" aria-checked="false" data-mode="rotos" class="mode"><i style="--c:#ff8a80">R</i>Rotos</button>
      </div>
      <div class="mouth"><svg id="arch" viewBox="0 48 400 206" role="group" aria-label="Tus dientes, toca los que quieras marcar"></svg></div>
      <p class="smile-live" id="smile-live" aria-live="polite">Toca un diente para marcarlo.</p>
      <div class="smile-act">
        <a class="btn btn-wa" id="smile-wa" data-dyn href="WA:Hola Dr. Ilich, quiero agendar una valoración."><svg><use href="#i-wa"/></svg>Mandar mi sonrisa</a>
        <button type="button" class="lnk" id="smile-clear">Limpiar</button>
      </div>
      <noscript><p class="smile-sub">Activa JavaScript para marcar tus dientes, o escríbenos directo por WhatsApp.</p></noscript>
    </div>
  </div>
</section>
