<section class="rot" id="rotulo" data-rotulo>
  <div class="wrap rot-grid">
    <div class="rot-foto" data-reveal>
      {{pic:rotulo|Rótulo iluminado de Tacos San Juan de los Lagos de noche|(min-width:760px) 55vw,100vw|}}
    </div>
    <div>
      <p class="eyebrow" data-reveal>Cae la tarde</p>
      <div class="hora-gig" data-reveal data-d="1" aria-label="Cuatro de la tarde">4<small>PM</small></div>

      <p class="lead" data-reveal data-d="2" style="margin-bottom:18px">La parrilla arranca a las 4 y no se apaga hasta pasada la medianoche. Fines de semana, hasta la 1.</p>
      <a class="link" href="#visitanos" data-reveal data-d="2">Ver horario por día</a>
    </div>
  </div>
</section>
