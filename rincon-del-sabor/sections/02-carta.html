<section class="sec carta" id="carta">
  <div class="wrap">
    <h2 class="tt" data-reveal>Tu antojo, <em>ya con precio.</em></h2>
    <div class="carta-grid">
      <article class="cd cd-big" data-reveal id="cd-pozole">
        <div class="ph zz"><img src="img/poz-960.webp" srcset="img/poz-480.webp 480w, img/poz-960.webp 960w, img/poz-1152.webp 1152w" sizes="(min-width:700px) 46vw, 100vw" width="1152" height="2048" alt="Pozole rojo con tostadas, lechuga y rábano"></div>
        <div class="cd-body">
          <h3>Pozole</h3>
          <p class="cd-note">Rojo todos los días. Verde, solo viernes. Blanco, solo sábado.</p>
          <fieldset class="opts"><legend>El de hoy</legend>
            <div class="opt-row">
              <label class="opt"><input type="radio" name="pz-tipo" value="rojo" checked><span>Rojo<small>diario</small></span></label>
              <label class="opt"><input type="radio" name="pz-tipo" value="verde"><span>Verde<small>viernes</small></span></label>
              <label class="opt"><input type="radio" name="pz-tipo" value="blanco"><span>Blanco<small>sábado</small></span></label>
            </div></fieldset>
          <fieldset class="opts"><legend>Tamaño</legend>
            <div class="opt-row" id="pz-tam">
              <label class="opt"><input type="radio" name="pz-tam" value="junior"><span>Junior<small data-p="junior">$65</small></span></label>
              <label class="opt"><input type="radio" name="pz-tam" value="chico" checked><span>Chico<small data-p="chico">$75</small></span></label>
              <label class="opt"><input type="radio" name="pz-tam" value="grande"><span>Grande<small data-p="grande">$85</small></span></label>
            </div></fieldset>
          <button type="button" class="add" id="pz-add" data-add-pozole><svg aria-hidden="true"><use href="#i-plus"/></svg><span>Agregar a mi comanda</span></button>
        </div>
      </article>
      <div class="carta-side">
        <article class="cd cd-row" data-reveal>
          <div class="ph"><img src="img/enc-480.webp" srcset="img/enc-480.webp 480w, img/enc-960.webp 960w" sizes="(min-width:1100px) 260px, 116px" width="480" height="270" alt="Enchiladas con queso y cebolla"></div>
          <div class="cd-body"><div><h3>Enchiladas</h3><p class="cd-note">De queso o cebolla</p></div>
            <div class="pr"><b>$70</b><button type="button" class="add" data-add data-id="enchiladas-q" data-name="Enchiladas de queso o cebolla" data-price="70"><svg aria-hidden="true"><use href="#i-plus"/></svg><span>Agregar</span></button></div></div>
        </article>
        <article class="cd cd-row" data-reveal>
          <div class="ph"><img src="img/flau-480.webp" srcset="img/flau-480.webp 480w, img/flau-960.webp 960w" sizes="(min-width:1100px) 260px, 116px" width="480" height="312" alt="Flautas con aguacate sobre plato de barro"></div>
          <div class="cd-body"><div><h3>Flautas</h3><p class="cd-note">Con su aguacate</p></div>
            <div class="pr"><b>$70</b><button type="button" class="add" data-add data-id="flautas" data-name="Flautas" data-price="70"><svg aria-hidden="true"><use href="#i-plus"/></svg><span>Agregar</span></button></div></div>
        </article>
        <article class="cd cd-row" data-reveal>
          <div class="ph"><img src="img/tost-480.webp" srcset="img/tost-480.webp 480w, img/tost-960.webp 960w" sizes="(min-width:1100px) 260px, 116px" width="480" height="360" alt="Tostada con crema y queso en plato de barro"></div>
          <div class="cd-body"><div><h3>Tostada</h3><p class="cd-note">Pídela de pata, $55</p></div>
            <div class="pr"><b>$40</b><button type="button" class="add" data-add data-id="tostada" data-name="Tostada" data-price="40"><svg aria-hidden="true"><use href="#i-plus"/></svg><span>Agregar</span></button></div></div>
        </article>
        <p class="cd-note" data-reveal>Más abajo, todo lo que sale del comal.</p>
      </div>
    </div>
  </div>
</section>
