<section class="sec plano" id="plano">
  <p class="eyebrow">Arma tu estancia</p>
  <h2>Toca el patio.<br><em>Elige tu lado.</em></h2>
  <div class="plano-grid">
    <figure class="mapa">
      <svg viewBox="0 0 320 300" role="group" aria-label="Plano del patio de la hacienda: jardín y alberca">
        <rect x="6" y="6" width="308" height="288" rx="150" ry="150" class="pl-muro"/>
        <g class="pl-ala"><rect x="38" y="44" width="244" height="30" rx="4"/><rect x="38" y="226" width="244" height="30" rx="4"/></g>
        <g class="pl-arcos" aria-hidden="true"><path d="M52 74v-12a8 8 0 0 1 16 0v12M84 74v-12a8 8 0 0 1 16 0v12M116 74v-12a8 8 0 0 1 16 0v12M188 74v-12a8 8 0 0 1 16 0v12M220 74v-12a8 8 0 0 1 16 0v12M252 74v-12a8 8 0 0 1 16 0v12"/></g>
        <g class="pl-zona" data-zona="jardin" tabindex="-1">
          <rect x="38" y="84" width="244" height="132" rx="10" class="pl-pasto"/>
          <text x="160" y="104" class="pl-rot">JARDÍN</text>
        </g>
        <g class="pl-zona" data-zona="alberca" tabindex="-1">
          <path class="pl-agua" d="M76 138c0-18 22-26 50-24 20 2 28 10 48 8 28-3 52 4 52 24 0 22-24 34-56 32-22-1-30-8-50-6-26 2-44-8-44-34z"/>
          <path class="pl-ola" d="M110 150q10-6 20 0t20 0 20 0M120 166q10-6 20 0t20 0"/>
          <text x="160" y="198" class="pl-rot">ALBERCA</text>
        </g>
        <circle cx="258" cy="196" r="4.500" class="pl-pav"/><path d="M258 192c4-12 10-14 14-14M258 192c-1-12 2-18 6-22" class="pl-pavp"/>
      </svg>
      <figcaption>Un pavorreal anda por el jardín.</figcaption>
    </figure>
    <div class="armar" id="armar">
      <fieldset class="paso"><legend><b>1</b> ¿Qué lado?</legend>
        <div class="opts">
          <button type="button" class="opt" data-k="zona" data-v="jardin" aria-pressed="false">Jardín</button>
          <button type="button" class="opt" data-k="zona" data-v="alberca" aria-pressed="false">Alberca</button>
        </div>
      </fieldset>
      <div class="vista" id="vista" aria-live="polite"><p class="vista-vacio">Elige arriba</p></div>
      <fieldset class="paso"><legend><b>2</b> ¿Quiénes van?</legend>
        <div class="opts">
          <button type="button" class="opt" data-k="tipo" data-v="pareja" aria-pressed="false">Pareja<small>1 cama king</small></button>
          <button type="button" class="opt" data-k="tipo" data-v="familia" aria-pressed="false">Familia<small>2 camas dobles</small></button>
        </div>
      </fieldset>
      <fieldset class="paso"><legend><b>3</b> ¿Cuántas noches?</legend>
        <div class="step"><button type="button" id="n-menos" aria-label="Una noche menos">&minus;</button><output id="n-val">1 noche</output><button type="button" id="n-mas" aria-label="Una noche más">+</button></div>
      </fieldset>
      <fieldset class="paso"><legend><b>4</b> ¿Cuándo llegas?</legend>
        <div class="dias" id="dias" role="group" aria-label="Día de llegada"></div>
      </fieldset>
      <div class="resumen" id="resumen"><p class="res-label">Tu resumen</p><p class="res-txt" id="res-txt">Elige arriba</p>
        <div class="btns"><a class="btn btn-main" id="res-call" href="tel:+524499102330">Llamar y decirlo</a><button type="button" class="btn btn-line" id="res-copy">Copiar resumen</button></div>
        <p class="res-ok" id="res-ok" role="status"></p>
      </div>
    </div>
  </div>
</section>
