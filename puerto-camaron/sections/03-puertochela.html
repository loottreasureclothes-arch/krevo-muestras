<section class="pch" id="puertochela">
  <div class="pc-wrap pch-grid">
    <header class="pch-head">
      <p class="pc-eyebrow" data-reveal>Puertochelas, de su carta</p>
      <h2 class="pc-title" data-reveal>Sírvete<em>la tuya</em></h2>
      <p class="pc-lead" data-reveal>Cerveza con limón, salsas negras y clamato. Elige el tope y mira cómo se sirve.</p>
    </header>
    <div class="pch-stage" data-reveal>
      <svg class="pch-svg" id="pch-svg" viewBox="0 0 240 300" role="img" aria-label="Vaso de puertochela que se llena con lo que eliges"></svg>
      <p class="pch-cap" id="pch-cap" aria-live="polite">Elige un tope abajo</p>
    </div>
    <div class="pch-ctl">
      <div class="pch-row" role="group" aria-label="Cerveza">
        <span class="pch-lbl">Cerveza</span>
        <div class="pch-beer">
          <button type="button" data-beer="Corona" aria-pressed="true">Corona</button>
          <button type="button" data-beer="Victoria" aria-pressed="false">Victoria</button>
        </div>
      </div>
      <div class="pch-lbl">Elige tu tope</div>
      <div class="pch-rail" id="pch-rail" role="listbox" aria-label="Puertochelas"></div>
      <div class="pch-row" role="group" aria-label="Cuántas">
        <span class="pch-lbl">Cuántas</span>
        <div class="pch-n" id="pch-n"></div>
      </div>
      <div class="pch-ticket" id="pch-ticket" aria-live="polite">
        <p class="pch-t-line" id="pch-line">Elige arriba</p>
        <p class="pch-t-desc" id="pch-desc">Tu cuenta se arma sola con los precios de la carta.</p>
        <p class="pch-t-total"><span>Total</span><b id="pch-total">Elige arriba</b></p>
      </div>
      <a class="pc-btn pc-btn-wa" id="pch-wa" href="wa:Hola Puerto Camarón, quiero armar mi puertochela. ¿Qué me recomiendan?" target="_blank" rel="noopener">Pedirla por WhatsApp</a>
    </div>
  </div>
</section>
