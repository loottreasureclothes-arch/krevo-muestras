<section class="ks-sec ks-sec--div ks-proceso" id="proceso" aria-labelledby="ks-h-proc">
  <div class="ks-wrap ks-proc-grid">
    <div class="ks-proc-main">
      <h2 class="ks-h" id="ks-h-proc" data-reveal="mask"><span class="ks-ln" style="--i:0">Evaluamos, identificamos</span><span class="ks-ln ks-two" style="--i:1">y aplicamos.</span></h2>
      <ol class="ks-steps">
        <li class="ks-step" data-reveal="stretch" style="--i:0"><span class="ks-num">01</span><i class="ks-rayas" aria-hidden="true"><i></i><i></i></i><span class="ks-step-t">Evaluación clínico-funcional</span></li>
        <li class="ks-step" data-reveal="stretch" style="--i:1"><span class="ks-num">02</span><i class="ks-rayas" aria-hidden="true"><i></i><i></i></i><span class="ks-step-t">Diagnóstico preciso</span></li>
        <li class="ks-step" data-reveal="stretch" style="--i:2"><span class="ks-num">03</span><i class="ks-rayas" aria-hidden="true"><i></i><i></i></i><span class="ks-step-t">Tratamiento personalizado</span></li>
        <li class="ks-step" data-reveal="stretch" style="--i:3"><span class="ks-num">04</span><i class="ks-rayas" aria-hidden="true"><i></i><i></i></i><span class="ks-step-t">Rehabilitación profesional</span></li>

    <div class="ks-proc-side">
      <figure class="ks-frame ks-proc-cab" data-reveal="photo">
        <picture>
          <source media="(min-width: 760px)" type="image/webp" srcset="img/cabina-d-800.webp 800w, img/cabina-d-1280.webp 1280w" sizes="(min-width: 900px) 560px, 100vw">

      </figure>
      <div class="ks-who">
        <figure class="ks-frame ks-who-ph" data-reveal="photo">
