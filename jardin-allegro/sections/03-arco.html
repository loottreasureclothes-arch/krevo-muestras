<section class="sec sec-arco" id="arco" data-hide-wa>
  <div class="wrap arco-grid">
    <div class="arco-head">
      <p class="eyebrow">Arma tu fiesta</p>
      <h2 class="h-lg">Pinta tu arco. <span class="l2">Nosotros lo armamos.</span></h2>
    </div>
    <div class="arco-stage">
      <svg id="arco-svg" viewBox="0 0 360 230" role="img" aria-label="Arco de globos. Toca o arrastra sobre los globos para pintarlos del color elegido"></svg>
      <button type="button" class="age" id="arco-age" aria-label="Edad del festejado, toca para cambiar"><b id="arco-agen">5</b><small>años</small></button>
    </div>
    <div class="arco-ui">
      <p class="mini">1. Elige color y pinta</p>
      <div class="chips" id="arco-colors" role="radiogroup" aria-label="Color de globo"></div>
      <p class="mini">2. Elige el tema</p>
      <div class="chips chips-t" id="arco-temas" role="radiogroup" aria-label="Tema"></div>
      <div class="fld">
        <label>Nombre del festejado<input id="arco-nombre" type="text" maxlength="30" autocomplete="off" placeholder="Opcional"></label>
        <label>Fecha que te gusta<input id="arco-fecha" type="date"></label>
      </div>
      <p class="resumen" id="arco-resumen" aria-live="polite"></p>
      <a class="btn btn-wa" id="arco-send" href="WA:Hola Allegro, quiero cotizar una fiesta."><svg width="20" height="20" aria-hidden="true"><use href="#i-wa"/></svg>Mandar mi arco</a>
    </div>
  </div>
</section>
