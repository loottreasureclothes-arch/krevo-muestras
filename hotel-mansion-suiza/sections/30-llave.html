<section class="llv" id="llave">
  <div class="wrap">
    <p class="eyebrow">Tu llave</p>
    <h2 data-reveal>Cuelga<br><em>tu llave</em></h2>
    <div class="llv-box" id="llv">
      <div class="llv-col">
        <fieldset class="paso">
          <legend><b>1</b> ¿Qué necesitas?</legend>
          <div class="sitios" role="radiogroup" aria-label="Cuarto o sala">
            <button type="button" class="sitio" role="radio" aria-checked="false" data-v="matrimonial" data-n="Cama matrimonial" data-img="cama"><span class="gable"><img src="img/cama-480.webp" alt="" width="480" height="330"></span><b>Cama matrimonial</b></button>
            <button type="button" class="sitio" role="radio" aria-checked="false" data-v="dos" data-n="Dos camas" data-img="dos-camas"><span class="gable"><img src="img/dos-camas-480.webp" alt="" width="480" height="330"></span><b>Dos camas</b></button>
            <button type="button" class="sitio" role="radio" aria-checked="false" data-v="sala" data-n="Sala de juntas" data-img="sala-b"><span class="gable"><img src="img/sala-b-480.webp" alt="" width="480" height="330"></span><b>Sala de juntas</b></button>
          </div>
        </fieldset>
        <fieldset class="paso">
          <legend><b>2</b> <span id="q2">¿Cuántas noches?</span></legend>
          <div class="step">
            <button type="button" id="menos" aria-label="Una menos">&minus;</button>
            <output id="cant" aria-live="polite">1</output>
            <button type="button" id="mas" aria-label="Una más">+</button>
            <span id="unid">noche</span>
          </div>
        </fieldset>
        <fieldset class="paso">
          <legend><b>3</b> ¿Cuándo llegas? <i>(opcional)</i></legend>
          <input id="fecha" class="fecha" type="date" aria-label="Fecha de llegada">
        </fieldset>
      </div>
      <div class="llv-tag" id="tag" aria-live="polite">
        <svg class="ring" viewBox="0 0 120 70" aria-hidden="true"><circle cx="60" cy="40" r="26" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="60" cy="18" r="9" fill="none" stroke="currentColor" stroke-width="4"/></svg>
        <div class="tag-body">
          <div class="tag-pic"><img id="tag-img" src="img/cama-480.webp" alt="" width="480" height="330"></div>
          <p class="tag-k">Para el Hotel Mansión Suiza</p>
          <p class="tag-n" id="tag-n">Elige arriba</p>
          <p class="tag-m" id="tag-m">Pregunta la tarifa</p>
          <p class="tag-f" id="tag-f">Entrada desde las 15:00 y salida a las 12:00.</p>
          <div class="row">
            <a class="btn fill" id="l-call" href="tel:+524499172233"><svg width="18" height="18" aria-hidden="true"><use href="#i-phone"/></svg> Llamar y confirmar</a>
            <button type="button" class="btn" id="l-copy"><svg width="18" height="18" aria-hidden="true"><use href="#i-copy"/></svg>Copiar resumen</button>
          </div>
          <p class="nota-ok" id="l-ok" role="status"></p>
        </div>
      </div>
    </div>
  </div>
</section>
